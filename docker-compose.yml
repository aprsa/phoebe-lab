services:
  phoebe-lab:
    build:
      context: .
      dockerfile: Dockerfile
    image: phoebe-lab:latest
    container_name: phoebe-lab
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./examples:/usr/share/phoebe-lab/examples:ro
      - ./config.toml:/etc/phoebe-lab/config.toml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 512M
